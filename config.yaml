# Configuration for DYNAGNN scripts.

dynagnn:
  version: 1.11

dynawo:
  path: "path to myEnvDynawo.sh"

data:
  path: "path to data folder"

simulation:
  event_time: 
  initialization_duration:  # total Dynawo run time (s) per OP before contingency simulations, to find a steady state solution for the initial operating point

network:
  country_filter: []

kpi:
  window_sec: 
  step_sec: 
  class_bins:
    voltage:
      cuts:  # raw KPI thresholds (ascending), e.g. [1e-7, 7.5e-7, 7.5e-6, 1.5e-5]
    spower:
      cuts:  # raw KPI thresholds (ascending)

model:
  num_classes: 6

training:
  epochs:
  patience:
  batch_size:
  split_mode:
  seed:
  training:
  validation:
  testing:

  # Fixed loss construction and output-decoding settings.
  pair_aware:
    classification_weight: 1.0
    regression_weight: 0.30
    inactive_gate_weight: 0.20
    ordinal_weight: 0.10
    class_weight_mode: sqrt_inverse
    gate_pos_weight_mode: balanced
    gate_threshold: 0.50
    epsilon: 1.0e-10
    selection_output: auto

optuna:
  n_trials:
  hparams:
    hidden_dim:
      type: categorical
      choices: [64, 128, 256]
    node_id_dim:
      type: categorical
      choices: [16, 24, 32]
    contingency_id_dim:
      type: categorical
      choices: [16, 32, 64]
    type_dim:
      type: categorical
      choices: [4, 8, 16]
    pair_dim:
      type: categorical
      choices: [16, 32, 64]
    num_gnn_layers:
      type: int
      low: 2
      high: 4
    decoder_hidden_dim:
      type: categorical
      choices: [128, 256, 512]
    dropout:
      type: float
      low: 0.05
      high: 0.35
    lr:
      type: float
      low: 0.00001
      high: 0.001
      log: true
    weight_decay:
      type: float
      low: 0.0000001
      high: 0.001
      log: true

inference:
  initialization_duration:  # total Dynawo run time (s) before constructing the graph, to find a steady state solution for the initial operating point